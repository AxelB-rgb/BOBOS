<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan interactif · Copilote des espaces</title>
<link rel="stylesheet" href="/static/map.css">
</head>
<body>
<header class="topbar">
  <div><span class="eyebrow">JUMEAU DES ESPACES</span><h1>Plan interactif des anomalies</h1><p>Cliquez sur une salle pour afficher ses anomalies et les conseils associés.</p></div>
  <div class="controls">
    <label>Étage <select id="floor"></select></label>
    <label>Du <input id="from" type="date"></label>
    <label>Au <input id="to" type="date"></label>
    <button id="refresh">Actualiser</button>
  </div>
</header>
<main>
  <section class="map-panel">
    <div class="map-head"><div><strong id="floor-title">Plan</strong><span id="map-count"></span></div><div class="legend"><span><i class="dot high"></i>Priorité haute</span><span><i class="dot medium"></i>Moyenne</span><span><i class="dot low"></i>Faible</span><span><i class="dot none"></i>Aucune</span></div></div>
    <div id="map" class="map"><div class="loading">Chargement du plan…</div></div>
  </section>
  <aside id="room-panel" class="room-panel empty"><div class="panel-placeholder">Sélectionnez une salle sur le plan.</div></aside>
</main>
<script src="/static/map.js"></script>
</body>
</html>
